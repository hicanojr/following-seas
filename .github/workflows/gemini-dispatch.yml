name: "Final Gemini Review"

on:
  issue_comment:
    types:
      - "created"

jobs:
  dispatch:
    # Final review is intentionally manual. Only a trusted repository member
    # can request the exact command on a pull request.
    if: |-
      github.event.sender.type == 'User' &&
      github.event.comment.body == '@gemini-cli /review' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.issue.pull_request
    runs-on: "ubuntu-latest"
    permissions:
      issues: "write"
    steps:
      - name: "Acknowledge final review request"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          ISSUE_NUMBER: "${{ github.event.issue.number }}"
          REPOSITORY: "${{ github.repository }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "Final Gemini review started. Progress: ${RUN_URL}" \
            --repo "${REPOSITORY}"

  review:
    needs: "dispatch"
    uses: "./.github/workflows/gemini-review.yml"
    permissions:
      contents: "read"
      pull-requests: "write"
    secrets:
      GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"

  failure-comment:
    needs:
      - "dispatch"
      - "review"
    if: |-
      always() && needs.dispatch.result == 'success' && needs.review.result == 'failure'
    runs-on: "ubuntu-latest"
    permissions:
      issues: "write"
    steps:
      - name: "Report final review failure"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          ISSUE_NUMBER: "${{ github.event.issue.number }}"
          REPOSITORY: "${{ github.repository }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "Final Gemini review failed. Logs: ${RUN_URL}" \
            --repo "${REPOSITORY}"
